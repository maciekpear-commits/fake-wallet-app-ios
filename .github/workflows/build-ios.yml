name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [feature/build-ios]

jobs:
  build:
    runs-on: macos-14

steps:
      - uses: actions/checkout@v4

- name: Install CocoaPods
        run: pod install --repo-update

- name: Build unsigned app
        run: |
          xcodebuild \
            -workspace fake-wallet.xcworkspace \
            -scheme fake-wallet \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

- name: Package IPA
        run: |
          set -euo pipefail
          app_path="$(find build/Build/Products -type d -name '*.app' -path '*iphoneos*' | head -n 1)"
          test -n "$app_path"
          mkdir -p Payload
          cp -R "$app_path" Payload/
          zip -r fake-wallet-unsigned.ipa Payload

- uses: actions/upload-artifact@v4
        with:
          name: fake-wallet-unsigned-ipa
          path: fake-wallet-unsigned.ipa
          if-no-files-found: error
